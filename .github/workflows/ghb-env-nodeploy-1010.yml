name: GHB Environment No-Deploy 1010
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normal_gate:
    runs-on: ubuntu-latest
    environment: ghb-nodeploy-review-1010
    steps:
      - run: echo GH_BOUNTY_NORMAL_GATE_STEP_1010
  no_deployment_gate:
    runs-on: ubuntu-latest
    environment:
      name: ghb-nodeploy-review-1010
      deployment: false
    steps:
      - run: echo GH_BOUNTY_NODEPLOY_GATE_STEP_1010

name: Cache Reuse Child Probe
on:
  workflow_call:
jobs:
  save:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - name: Create harmless marker
        run: mkdir -p cache-reuse && printf GH_BOUNTY_CACHE_REUSE_CHILD_20261009 > cache-reuse/marker
      - name: Save harmless cache
        uses: actions/cache/save@v4
        with:
          path: cache-reuse
          key: gh-bounty-cache-reuse-child-20261009
